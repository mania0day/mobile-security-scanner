# Mobile Security Scanner — Docker Compose (Android & iOS)
#
# HOW TO USE:
#   The orchestrator calls `docker compose run <service>` for each
#   service in the pipeline. You rarely run this file directly.
#
# EXAMPLES:
#   python backend/orchestrator/orchestrator.py --platform android --mode minimal
#   python backend/orchestrator/orchestrator.py --platform ios --mode minimal

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ADB_TIMEOUT: ${ADB_TIMEOUT:-30}

x-common-volumes: &common-volumes
  - ./backend/output:/app/backend/output

x-usb-volumes: &usb-volumes
  - ./backend/output:/app/backend/output
  - /dev/bus/usb:/dev/bus/usb
  - ~/.android:/root/.android

# Starting-point resource ceilings (not measured/tuned) so a single runaway
# container (e.g. a malformed APK causing androguard to loop) can't take down
# the host. Adjust based on observed usage.
x-default-limits: &default-limits
  mem_limit: 768m
  cpus: 1.0

x-heavy-limits: &heavy-limits
  mem_limit: 2g
  cpus: 2.0

services:

  # ─────────────────────────────────────────
  # ANDROID DEVICE & COLLECTION SERVICES
  # ─────────────────────────────────────────

  adb:
    build:
      context: .
      dockerfile: services/adb/Dockerfile
    image: mobile-security-adb
    <<: *default-limits
    privileged: true  # requires root for /dev/bus/usb (USB) access
    environment:
      <<: *common-env
      OUTPUT_DIR: /app/backend/output/adb
    volumes: *usb-volumes
    network_mode: host

  apk_inventory:
    build:
      context: .
      dockerfile: services/apk_inventory/Dockerfile
    image: mobile-security-apk-inventory
    <<: *default-limits
    privileged: true  # requires root for /dev/bus/usb (USB) access
    environment:
      <<: *common-env
      ADB_OUTPUT_DIR: /app/backend/output/adb
      OUTPUT_DIR: /app/backend/output/apk_inventory
      INCLUDE_SYSTEM_APPS: ${INCLUDE_SYSTEM_APPS:-true}
    volumes: *usb-volumes
    network_mode: host

  apk_extractor:
    build:
      context: .
      dockerfile: services/apk_extractor/Dockerfile
    image: mobile-security-apk-extractor
    <<: *heavy-limits
    privileged: true  # requires root for /dev/bus/usb (USB) access
    environment:
      <<: *common-env
      ADB_OUTPUT_DIR: /app/backend/output/adb
      INVENTORY_OUTPUT_DIR: /app/backend/output/apk_inventory
      APKS_OUTPUT_DIR: /app/backend/output/apks
      EXTRACT_SYSTEM_APPS: ${EXTRACT_SYSTEM_APPS:-false}
      ADB_TIMEOUT: 60
    volumes: *usb-volumes
    network_mode: host

  # ─────────────────────────────────────────
  # ANDROID STATIC ANALYSIS SERVICES
  # ─────────────────────────────────────────

  apkid:
    build:
      context: .
      dockerfile: services/apkid/Dockerfile
    image: mobile-security-apkid
    <<: *heavy-limits
    environment:
      <<: *common-env
      INVENTORY_OUTPUT_DIR: /app/backend/output/apk_inventory
      OUTPUT_DIR: /app/backend/output/apkid
      ANALYSIS_TIMEOUT: 120
    volumes: *common-volumes

  androguard:
    build:
      context: .
      dockerfile: services/androguard/Dockerfile
    image: mobile-security-androguard
    <<: *heavy-limits
    environment:
      <<: *common-env
      INVENTORY_OUTPUT_DIR: /app/backend/output/apk_inventory
      OUTPUT_DIR: /app/backend/output/androguard
      ANALYSIS_TIMEOUT: 180
    volumes: *common-volumes

  certificate:
    build:
      context: .
      dockerfile: services/certificate/Dockerfile
    image: mobile-security-certificate
    <<: *default-limits
    environment:
      <<: *common-env
      INVENTORY_OUTPUT_DIR: /app/backend/output/apk_inventory
      OUTPUT_DIR: /app/backend/output/certificate
    volumes: *common-volumes

  permission_analyzer:
    build:
      context: .
      dockerfile: services/permission_analyzer/Dockerfile
    image: mobile-security-permission-analyzer
    <<: *default-limits
    environment:
      <<: *common-env
      ANDROGUARD_OUTPUT_DIR: /app/backend/output/androguard
      OUTPUT_DIR: /app/backend/output/permission_analyzer
    volumes: *common-volumes

  root_detection:
    build:
      context: .
      dockerfile: services/root_detection/Dockerfile
    image: mobile-security-root-detection
    <<: *default-limits
    privileged: true  # requires root for /dev/bus/usb (USB) access
    environment:
      <<: *common-env
      ADB_OUTPUT_DIR: /app/backend/output/adb
      OUTPUT_DIR: /app/backend/output/root_detection
    volumes: *usb-volumes
    network_mode: host

  hash_lookup:
    build:
      context: .
      dockerfile: services/hash_lookup/Dockerfile
    image: mobile-security-hash-lookup
    <<: *default-limits
    environment:
      <<: *common-env
      INVENTORY_OUTPUT_DIR: /app/backend/output/apk_inventory
      OUTPUT_DIR: /app/backend/output/hash_lookup
      VT_API_KEY: ${VT_API_KEY:-}
      VT_ENABLED: ${VT_ENABLED:-0}
      VT_MAX_QUERIES: ${VT_MAX_QUERIES:-30}
      VT_THROTTLE_SECONDS: ${VT_THROTTLE_SECONDS:-12}
      VT_TIMEOUT: ${VT_TIMEOUT:-12}
    volumes: *common-volumes

  yara:
    build:
      context: .
      dockerfile: services/yara/Dockerfile
    image: mobile-security-yara
    <<: *heavy-limits
    environment:
      <<: *common-env
      INVENTORY_OUTPUT_DIR: /app/backend/output/apk_inventory
      OUTPUT_DIR: /app/backend/output/yara
      RULES_PATH: /app/yara/rules/android_malware.yar
    volumes: *common-volumes

  # ─────────────────────────────────────────
  # iOS SERVICES (iPhone Scan Module)
  # ─────────────────────────────────────────

  ios_device:
    build:
      context: .
      dockerfile: services/ios_device/Dockerfile
    image: mobile-security-ios-device
    <<: *default-limits
    privileged: true  # requires root for /dev/bus/usb (USB) access
    environment:
      <<: *common-env
      OUTPUT_DIR: /app/backend/output/ios_device
    volumes: *usb-volumes
    network_mode: host

  plist_analyzer:
    build:
      context: .
      dockerfile: services/plist_analyzer/Dockerfile
    image: mobile-security-plist-analyzer
    <<: *default-limits
    environment:
      <<: *common-env
      OUTPUT_DIR: /app/backend/output/plist_analyzer
    volumes: *common-volumes

  macho_analyzer:
    build:
      context: .
      dockerfile: services/macho_analyzer/Dockerfile
    image: mobile-security-macho-analyzer
    <<: *default-limits
    environment:
      <<: *common-env
      OUTPUT_DIR: /app/backend/output/macho_analyzer
    volumes: *common-volumes

  ios_certificate:
    build:
      context: .
      dockerfile: services/ios_certificate/Dockerfile
    image: mobile-security-ios-certificate
    <<: *default-limits
    environment:
      <<: *common-env
      OUTPUT_DIR: /app/backend/output/ios_certificate
    volumes: *common-volumes

  jailbreak_detection:
    build:
      context: .
      dockerfile: services/jailbreak_detection/Dockerfile
    image: mobile-security-jailbreak-detection
    <<: *default-limits
    privileged: true  # requires root for /dev/bus/usb (USB) access
    environment:
      <<: *common-env
      OUTPUT_DIR: /app/backend/output/jailbreak_detection
    volumes: *usb-volumes
    network_mode: host

  # ─────────────────────────────────────────
  # DEEP SCAN SERVICES (SHARED)
  # ─────────────────────────────────────────

  mobsf-server:
    image: opensecurity/mobile-security-framework-mobsf:latest
    <<: *heavy-limits
    ports:
      - "8000:8000"
    environment:
      MOBSF_API_KEY: ${MOBSF_API_KEY:-}
    volumes:
      - mobsf-data:/home/mobsf/.MobSF
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping",
             "-H", "Authorization: ${MOBSF_API_KEY:-}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mobsf:
    build:
      context: .
      dockerfile: services/mobsf/Dockerfile
    image: mobile-security-mobsf-client
    <<: *heavy-limits
    environment:
      <<: *common-env
      INVENTORY_OUTPUT_DIR: /app/backend/output/apk_inventory
      OUTPUT_DIR: /app/backend/output/mobsf
      MOBSF_URL: ${MOBSF_URL:-http://mobsf-server:8000}
      MOBSF_API_KEY: ${MOBSF_API_KEY:-}
      MOBSF_ENABLED: ${MOBSF_ENABLED:-false}
    volumes: *common-volumes
    depends_on:
      mobsf-server:
        condition: service_healthy

  mvt:
    build:
      context: .
      dockerfile: services/mvt/Dockerfile
    image: mobile-security-mvt
    <<: *heavy-limits
    privileged: true  # requires root for /dev/bus/usb (USB) access
    environment:
      <<: *common-env
      ADB_OUTPUT_DIR: /app/backend/output/adb
      OUTPUT_DIR: /app/backend/output/mvt
      IOCS_DIR: /app/mvt/iocs
      MVT_ENABLED: ${MVT_ENABLED:-false}
      ADB_TIMEOUT: 300
    volumes: *usb-volumes
    network_mode: host

  # ─────────────────────────────────────────
  # VULNERABILITY SCANNING
  # ─────────────────────────────────────────

  cve_checker:
    build:
      context: .
      dockerfile: services/cve_checker/Dockerfile
    image: mobile-security-cve-checker
    <<: *default-limits
    environment:
      <<: *common-env
      ADB_OUTPUT: /app/backend/output/adb
      OUTPUT_DIR: /app/backend/output/cve_checker
    volumes: *common-volumes

  # ─────────────────────────────────────────
  # AGGREGATION & REPORTING
  # ─────────────────────────────────────────

  risk_engine:
    build:
      context: .
      dockerfile: services/risk_engine/Dockerfile
    image: mobile-security-risk-engine
    <<: *default-limits
    environment:
      <<: *common-env
      OUTPUT_BASE: /app/backend/output
      RISK_OUTPUT_DIR: /app/backend/output/risk_engine
    volumes: *common-volumes

  report_generator:
    build:
      context: .
      dockerfile: services/report_generator/Dockerfile
    image: mobile-security-report-generator
    <<: *default-limits
    environment:
      <<: *common-env
      OUTPUT_BASE: /app/backend/output
      REPORT_OUTPUT_DIR: /app/backend/output/reports
    volumes: *common-volumes

volumes:
  mobsf-data: